services:
  app:
    build:
      context: .
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: predictiveguard
      POSTGRES_USER: predictiveguard
      POSTGRES_PASSWORD: predictiveguard
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: predictiveguard
      POSTGRES_USER: predictiveguard
      POSTGRES_PASSWORD: predictiveguard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predictiveguard -d predictiveguard"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
