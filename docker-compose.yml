services:
  app:
    build:
      context: .
    init: true
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: app-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-predictiveguard}
      POSTGRES_USER: ${POSTGRES_USER:-predictiveguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predictiveguard}
      POSTGRES_CONNECT_TIMEOUT_SECONDS: ${POSTGRES_CONNECT_TIMEOUT_SECONDS:-3}
      POSTGRES_COMMAND_TIMEOUT_SECONDS: ${POSTGRES_COMMAND_TIMEOUT_SECONDS:-3}
      POSTGRES_HEALTH_TIMEOUT_SECONDS: ${POSTGRES_HEALTH_TIMEOUT_SECONDS:-5}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-PredictiveGuardFailureModel}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
    ports:
      - "8000:8000"
    depends_on:
      app-db:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    networks: [predictiveguard]

  trainer:
    profiles: [training]
    build:
      context: .
    command: ["python", "-m", "ml.train"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-predictiveguard-ai4i}
      MODEL_NAME: ${MODEL_NAME:-PredictiveGuardFailureModel}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
      DATA_PATH: /app/data/ai4i2020.csv
      GIT_PYTHON_REFRESH: quiet
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true
    logging: *default-logging
    networks: [predictiveguard]

  mlflow:
    build:
      context: .
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=mlflow:5000,localhost:*,127.0.0.1:*,0.0.0.0:*
      - --backend-store-uri=postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@mlflow-db:5432/${MLFLOW_DB_NAME:-mlflow}
      - --artifacts-destination=/mlflow/artifacts
    ports:
      - "5050:5000"
    depends_on:
      mlflow-db:
        condition: service_healthy
      artifact-init:
        condition: service_completed_successfully
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    networks: [predictiveguard]

  artifact-init:
    build:
      context: .
    command: ["sh", "-c", "chown -R 10001:10001 /mlflow/artifacts"]
    user: "0:0"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    restart: "no"
    healthcheck:
      disable: true
    networks: [predictiveguard]

  app-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-predictiveguard}
      POSTGRES_USER: ${POSTGRES_USER:-predictiveguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predictiveguard}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-predictiveguard} -d ${POSTGRES_DB:-predictiveguard}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    networks: [predictiveguard]

  mlflow-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MLFLOW_DB_USER:-mlflow} -d ${MLFLOW_DB_NAME:-mlflow}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - mlflow_postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    networks: [predictiveguard]

volumes:
  postgres_data:
  mlflow_postgres_data:
  mlflow_artifacts:

networks:
  predictiveguard:
    driver: bridge
